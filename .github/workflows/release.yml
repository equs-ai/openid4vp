name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="$GITHUB_REF_NAME"
          manifest=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "tag      $tag"
          echo "manifest $manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $tag does not match Cargo.toml $manifest"
            exit 1
          fi
          echo "tag and manifest agree"

      - name: Test
        run: cargo test --verbose

      - name: Files that would ship
        run: cargo package --list

      - name: Pack and verify
        run: cargo package --verbose

      - name: Inspect the tarball
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tarball="target/package/$crate-$version.crate"
          ls -l "$tarball"
          echo "sha256 $(sha256sum "$tarball" | cut -d' ' -f1)"
          echo "files  $(tar -tzf "$tarball" | wc -l)"
          echo "--- manifest as published ---"
          tar -xzOf "$tarball" "$crate-$version/Cargo.toml"

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: crate-package
          path: target/package/*.crate
          if-no-files-found: error

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.EQUS_CREDENTIALS_SDK_CRATES_IO_TOKEN }}
        run: cargo publish --verbose
